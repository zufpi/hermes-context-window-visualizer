name: context-window-visualizer
version: "0.5.1"
description: Visualize the focused chat's context window and provider-reported account limits.
author: zufpi
homepage: https://github.com/zufpi/hermes-context-window-visualizer
manifest_version: 2
api_version: 1
license: MIT
requires_hermes: ">=0.21.5"
tags: [desktop, context, quota, instructions]
provides_tools: []
provides_hooks: []
provides_middleware: []
requires_env: []
config_schema:
  show_openai_codex:
    type: bool
    default: true
    label: OpenAI Codex
    description: Show account limits when the focused chat's returned provider id is openai-codex.
  show_anthropic:
    type: bool
    default: true
    label: Anthropic
    description: Show account limits when the focused chat's returned provider id is anthropic.
  show_openrouter:
    type: bool
    default: true
    label: OpenRouter
    description: Show account limits when the focused chat's returned provider id is openrouter.
  show_other:
    type: bool
    default: true
    label: Other providers
    description: Show account limits for any other returned provider id.
  show_cursor:
    type: bool
    default: false
    label: Cursor (via Quota cache)
    description: Show cached Cursor allowance from the optional Quota plugin on the focused profile. Controls display only; Quota manages its own credential access and refresh.
  account_refresh_mode:
    type: str
    default: "on menu open"
    choices: ["manual", "on menu open", "on menu open and focus"]
    label: Account refresh
    description: When to read session.usage for the focused chat. Manual waits for Refresh and does not read on menu open or window focus. On menu open reads once when the menu mounts and does not read again on window focus. On menu open and focus also reads when the window gains focus.
  context_file_paths:
    type: str
    default: "filename only"
    choices: ["hidden", "filename only", "full path"]
    label: Context-file paths
    description: How much of each context-file path to show in the menu. Hidden omits the path. Filename only shows the file name. Full path shows the path from the breakdown. Hidden and filename only reduce what appears on screen; the backend still sends the full path in the breakdown.
  show_estimated_composition:
    type: bool
    default: true
    label: Estimated composition
    description: Show the estimated composition bar, category rows, and note. Does not hide context occupancy, the model name, account bars, context-file status, or the footer meter.
